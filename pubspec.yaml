name: monn
description: "Monn is my personal investment tracking and analysis"
publish_to: "none"

version: 1.4.1+12

environment:
  sdk: ">=3.10.4 <4.0.0"

dependencies:
  collection: ^1.19.1
  dio: ^5.11.1
  drift: ^2.34.4
  easy_localization: ^3.0.8
  file_picker: ^12.2.0
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.8
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  iconoir_flutter: ^7.12.1
  json_annotation: ^4.12.0
  logger: ^2.8.0
  path: ^1.9.1
  path_provider: ^2.1.6
  retrofit: 4.10.0
  riverpod_annotation: ^4.0.7
  share_plus: ^13.3.0
  shared_preferences: ^2.5.3
  wolt_modal_sheet: ^0.11.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.34.6
  flutter_gen_runner: ^5.15.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  mockito: ^5.8.1
  retrofit_generator: ^10.2.11
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter_gen:
  output: lib/utils/
  fonts:
    enabled: false
  assets:
    outputs:
      class_name: MonnAssets
    exclude:
      - assets/translations/**

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/crypto/
    - assets/images/icon/
    - assets/images/counter_strike/

  fonts:
    - family: DMSans
      fonts:
        - asset: fonts/DMSans-Medium.ttf
        - asset: fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: fonts/DMSans-Bold.ttf
          weight: 700
        - asset: fonts/DMSans-ExtraBold.ttf
          weight: 800
        - asset: fonts/DMSans-Black.ttf
          weight: 900
